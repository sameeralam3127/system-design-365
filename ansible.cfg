[defaults]

# Inventory
inventory = inventory.ini

# Python interpreter handling
# Automatically discover once, stay silent, and remain deterministic
interpreter_python = auto_silent

# Fact gathering and caching (critical at scale)
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /var/tmp/ansible_fact_cache
fact_caching_timeout = 86400

# Output and logging
#stdout_callback = yaml
bin_ansible_callbacks = True
log_path = ./ansible.log

# Performance tuning
forks = 25
timeout = 30
pipelining = False

# Noise reduction
deprecation_warnings = False
retry_files_enabled = False
host_key_checking = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
control_path = ~/.ansible/cp/ansible-%%r@%%h:%%p

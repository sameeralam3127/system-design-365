---
- name: Install Certbot
  package:
    name: "{{ item }}"
    state: present
  loop:
    - certbot
    - python3-certbot-nginx

- name: Create webroot directory for HTTP challenge
  file:
    path: /var/www/html/.well-known/acme-challenge
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: "0755"

- name: Generate Let's Encrypt certificate
  command: >
    {{ certbot_path }} certonly --nginx
    --non-interactive --agree-tos
    --email {{ letsencrypt_email }}
    -d {{ ssl_domain }}
    {% for san in ssl_subject_alt_names %}-d {{ san }} {% endfor %}
    {% if letsencrypt_staging %}--staging{% endif %}
    --keep-until-expiring
  register: certbot_result
  changed_when: "'Certificate not yet due for renewal' not in certbot_result.stdout"

- name: Create symlinks to standard certificate paths
  file:
    src: "/etc/letsencrypt/live/{{ ssl_domain }}/fullchain.pem"
    dest: "{{ ssl_certificate_path }}/{{ ssl_domain }}.crt"
    state: link
    force: yes

- name: Create symlinks to standard key paths
  file:
    src: "/etc/letsencrypt/live/{{ ssl_domain }}/privkey.pem"
    dest: "{{ ssl_private_key_path }}/{{ ssl_domain }}.key"
    state: link
    force: yes

- name: Setup automatic certificate renewal
  cron:
    name: "Renew Let's Encrypt certificate"
    job: "{{ certbot_path }} renew --quiet --nginx"
    hour: 3
    minute: 30
    weekday: 0
  when: letsencrypt_auto_renew

---
- name: Generate OpenSSL configuration for self-signed certificate
  template:
    src: openssl-custom.cnf.j2
    dest: /tmp/openssl-{{ ssl_domain }}.cnf
    mode: "0644"

- name: Generate private key
  openssl_privatekey:
    path: "{{ ssl_private_key_path }}/{{ ssl_domain }}.key"
    size: "{{ ssl_key_size }}"
    type: RSA

- name: Generate certificate signing request (CSR)
  openssl_csr:
    path: /tmp/{{ ssl_domain }}.csr
    privatekey_path: "{{ ssl_private_key_path }}/{{ ssl_domain }}.key"
    country_name: "US"
    organization_name: "Self-Signed"
    common_name: "{{ ssl_domain }}"
    subject_alt_name: "DNS:{{ ssl_domain }}{% for san in ssl_subject_alt_names %},DNS:{{ san }}{% endfor %}"
    digest: sha256

- name: Generate self-signed certificate
  openssl_certificate:
    path: "{{ ssl_certificate_path }}/{{ ssl_domain }}.crt"
    privatekey_path: "{{ ssl_private_key_path }}/{{ ssl_domain }}.key"
    csr_path: /tmp/{{ ssl_domain }}.csr
    provider: selfsigned
    selfsigned_not_after: "+{{ ssl_certificate_days }}d"
    digest: sha256

- name: Clean up temporary files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/{{ ssl_domain }}.csr
    - /tmp/openssl-{{ ssl_domain }}.cnf

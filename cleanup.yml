---
- name: Cleanup Apache installation
  hosts: all
  become: yes
  tasks:
    - name: Stop apache service asynchronously (avoid hang)
      service:
        name: apache2
        state: stopped
      ignore_errors: yes
      async: 45
      poll: 0
      register: async_stop_job  # <--- register the async task result

    - name: Wait for apache service to stop
      async_status:
        jid: "{{ async_stop_job.ansible_job_id }}"  # <--- use registered job id here
      register: job_result
      until: job_result.finished
      retries: 10
      delay: 3

    - name: Remove apache2 package
      package:
        name: apache2
        state: absent
      ignore_errors: yes

    - name: Remove apache2 configuration directory
      file:
        path: /etc/apache2
        state: absent
      ignore_errors: yes

    - name: Remove apache2 document root directory
      file:
        path: /var/www/html
        state: absent
      ignore_errors: yes

    - name: Remove apache2 log directory
      file:
        path: /var/log/apache2
        state: absent
      ignore_errors: yes

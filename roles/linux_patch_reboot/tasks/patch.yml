---
- name: Wait for package manager lock (Debian/Ubuntu)
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock >/dev/null 2>&1 || \
          fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      sleep 5
    done
  when: ansible_facts.os_family == 'Debian'

- name: Patch Debian/Ubuntu
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
    autoremove: yes
  register: apt_result
  when: ansible_facts.os_family == 'Debian'

- name: Patch RHEL-based systems
  ansible.builtin.yum:
    name: "*"
    state: latest
  register: yum_result
  when: ansible_facts.os_family == 'RedHat'

- name: Check reboot-required file (Debian)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  when: ansible_facts.os_family == 'Debian'

- name: Set reboot flag (Debian)
  ansible.builtin.set_fact:
    reboot_required: true
  when:
    - ansible_facts.os_family == 'Debian'
    - reboot_required_file.stat.exists

- name: Set reboot flag (RHEL)
  ansible.builtin.set_fact:
    reboot_required: true
  when:
    - ansible_facts.os_family == 'RedHat'
    - yum_result is changed

- name: Trigger reboot handler if required
  ansible.builtin.meta: flush_handlers
  when: reboot_required | default(false)
  notify: reboot system

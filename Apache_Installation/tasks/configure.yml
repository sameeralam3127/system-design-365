---
# Apache configuration tasks
- name: Configure Apache
  block:
    - name: Ensure document root exists
      ansible.builtin.file:
        path: "{{ apache_root }}"
        state: directory
        owner: "{{ apache_user }}"
        group: "{{ apache_group }}"
        mode: '0755'

    - name: Deploy index.html
      ansible.builtin.copy:
        src: index.html
        dest: "{{ apache_root }}/index.html"
        owner: "{{ apache_user }}"
        group: "{{ apache_group }}"
        mode: '0644'
      notify: reload apache

    - name: Open port 80 on UFW (Ubuntu)
      ansible.builtin.ufw:
        rule: allow
        port: 80
        proto: tcp
      when: ansible_facts['os_family'] == "Debian"
      notify: reload apache

  rescue:
    - name: Log configuration failure
      ansible.builtin.debug:
        msg: "Apache configuration failed. Manual fix required."

    - name: Attempt to reload apache2
      ansible.builtin.command: apachectl graceful
      ignore_errors: true

    - name: Fail config step
      ansible.builtin.fail:
        msg: "Apache config failed after rescue."

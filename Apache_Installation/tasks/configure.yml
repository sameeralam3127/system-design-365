---
# tasks/configure.yml

- name: Configure Apache web server
  block:

    - name: Ensure document root exists
      file:
        path: "{{ apache_root }}"
        state: directory
        owner: "{{ apache_user }}"
        group: "{{ apache_group }}"
        mode: '0755'

    - name: Deploy index.html
      copy:
        src: index.html
        dest: "{{ apache_root }}/index.html"
        owner: "{{ apache_user }}"
        group: "{{ apache_group }}"
        mode: '0644'
      notify: reload apache

    - name: Enable UFW and allow port 80
      ufw:
        rule: allow
        port: "{{ apache_port | default(80) }}"
        proto: tcp
      when: ansible_facts.os_family == "Debian"

  rescue:

    - name: Handle configuration failure
      debug:
        msg: "Apache configuration failed. Attempting recovery..."

    - name: Attempt to reload Apache
      command: systemctl reload apache2
      ignore_errors: true

    - name: Notify admin of configuration failure
      debug:
        msg: "Manual intervention required: Apache config failed."

    - fail:
        msg: "Apache configuration failed after recovery attempts."

  always:
    - name: Ensure apache2 service is running
      service:
        name: apache2
        state: started
      ignore_errors: true

---
# Apache configuration tasks

- name: Configure Apache web server
  block:

    - name: Ensure document root exists
      ansible.builtin.file:
        path: "{{ apache_root | default('/var/www/html') }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy index.html
      ansible.builtin.copy:
        src: index.html
        dest: "{{ apache_root | default('/var/www/html') }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'
      notify: reload apache service

    - name: Allow port 80 with ufw
      ansible.builtin.command: ufw allow 80/tcp
      become: yes
      when: ansible_facts.os_family == "Debian"

    - name: Enable UFW firewall
      ansible.builtin.command: ufw enable
      become: true
      register: ufw_enable
      changed_when: "'Firewall is active' in ufw_enable.stdout"
      when: ansible_facts.os_family == "Debian"

  rescue:

    - name: Handle configuration failure
      ansible.builtin.debug:
        msg: "Apache configuration failed. Attempting recovery..."

    - name: Restart apache gracefully if binary exists
      ansible.builtin.command: apachectl graceful
      when: "'apachectl' in ansible_facts.binaries"
      ignore_errors: true

    - name: Notify admin about configuration failure
      ansible.builtin.debug:
        msg: "Manual intervention required for Apache configuration."
      changed_when: false

    - ansible.builtin.fail:
        msg: "Apache configuration failed after recovery steps."

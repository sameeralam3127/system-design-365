---
# Apache installation tasks for Ubuntu
- name: Install and start Apache2
  block:
    - name: Install apache2 package
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: yes
      notify: restart apache

    - name: Ensure apache2 service is running and enabled
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes

  rescue:
    - name: Handle failed Apache installation
      debug:
        msg: "Apache installation failed. Attempting cleanup..."

    - name: Purge broken apache2 install
      ansible.builtin.apt:
        name: apache2
        state: absent
        purge: yes
      ignore_errors: true

    - name: Clean leftover apache2 config directory
      ansible.builtin.file:
        path: /etc/apache2
        state: absent
      ignore_errors: true

    - name: Notify failure
      debug:
        msg: "Apache installation failed. Manual intervention needed."
      changed_when: false

    - name: Fail task
      ansible.builtin.fail:
        msg: "Apache installation failed after cleanup."

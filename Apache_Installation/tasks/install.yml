---
# Apache installation tasks

- name: Install Apache web server
  block:

    - name: Install apache2 package
      ansible.builtin.package:
        name: apache2
        state: present
      notify: restart apache service

    - name: Ensure apache service is running and enabled
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes

  rescue:

    - name: Handle installation failure
      ansible.builtin.debug:
        msg: "Apache installation failed. Attempting recovery..."

    - name: Clean up failed apache installation
      ansible.builtin.package:
        name: apache2
        state: absent
      ignore_errors: true

    - name: Notify admin about installation failure
      ansible.builtin.debug:
        msg: "Manual intervention required for Apache installation."
      changed_when: false

    - ansible.builtin.fail:
        msg: "Apache installation failed after recovery steps."

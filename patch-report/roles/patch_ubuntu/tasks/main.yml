---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist

- name: Autoremove unused packages
  ansible.builtin.apt:
    autoremove: true

- name: Autoclean apt cache
  ansible.builtin.apt:
    autoclean: true

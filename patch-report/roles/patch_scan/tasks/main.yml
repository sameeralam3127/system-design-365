- name: Detect OS family
  set_fact:
    os_family_detected: "{{ ansible_os_family }}"

- block:
    - name: Get pending updates (RHEL)
      command: yum -q check-update
      register: patch_output
      changed_when: false
      failed_when: false
  when: os_family_detected == "RedHat"

- block:
    - name: Get pending updates (Debian)
      command: apt list --upgradable
      register: patch_output
      changed_when: false
      failed_when: false
  when: os_family_detected == "Debian"

- name: Normalize patch data
  set_fact:
    pending_patches: >-
      {{
        patch_output.stdout_lines
        | default([])
        | reject('match','^Listing')
        | list
      }}

- name: Handle unreachable or error hosts
  set_fact:
    pending_patches: ["ERROR: Unable to retrieve updates"]
  when: patch_output is not defined

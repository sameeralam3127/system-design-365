- name: Ensure report directory exists
  file:
    path: "{{ report_dir }}"
    state: directory

- name: Generate per-host HTML reports
  template:
    src: host_report.html.j2
    dest: "{{ report_dir }}/{{ item }}.html"
  loop: "{{ groups['linux'] }}"
  vars:
    host_data: "{{ hostvars[item] }}"
  when: hostvars[item].pending_patches is defined

- name: Generate consolidated report
  template:
    src: consolidated_report.html.j2
    dest: "{{ report_dir }}/patch_report_{{ report_date }}.html"

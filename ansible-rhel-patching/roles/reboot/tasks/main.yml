---
- name: Check reboot requirement
  ansible.builtin.command: needs-restarting -r
  register: reboot_required_cmd
  failed_when: false
  changed_when: false

- name: Decide reboot necessity
  ansible.builtin.set_fact:
    reboot_needed: >-
      {{
        updates_applied and
        (kernel_updated or reboot_required_cmd.rc == 1)
      }}

- name: Reboot system if required
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible after patching"
    reboot_timeout: "{{ reboot_timeout_seconds }}"
  when: reboot_needed

- name: Get reboot history safely
  ansible.builtin.shell: |
    if command -v last &>/dev/null; then
      last reboot | wc -l
    else
      echo "N/A"
    fi
  register: reboot_count
  changed_when: false

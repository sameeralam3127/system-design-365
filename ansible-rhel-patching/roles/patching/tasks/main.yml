---
- name: Ensure dnf-utils is installed
  ansible.builtin.dnf:
    name: dnf-utils
    state: present

- name: Capture running kernel
  ansible.builtin.command: uname -r
  register: running_kernel
  changed_when: false

- name: Patch all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  register: dnf_update_result
  retries: 3
  delay: 30
  until: dnf_update_result is succeeded

- name: Set update_applied fact
  ansible.builtin.set_fact:
    updates_applied: "{{ dnf_update_result.changed | default(false) }}"

- name: Get installed kernels
  ansible.builtin.command: rpm -q kernel
  register: installed_kernels
  changed_when: false

- name: Detect kernel update
  ansible.builtin.set_fact:
    kernel_updated: "{{ running_kernel.stdout not in installed_kernels.stdout }}"

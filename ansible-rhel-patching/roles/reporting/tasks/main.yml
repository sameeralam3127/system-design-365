- name: Render HTML patching report
  ansible.builtin.template:
    src: report.html.j2
    dest: /tmp/patching-report.html
  run_once: true

- name: Send report via Gmail
  community.general.mail:
    host: "{{ smtp_host }}"
    port: "{{ smtp_port }}"
    username: "{{ gmail_username }}"
    password: "{{ gmail_app_password }}"
    secure: "{{ smtp_secure }}"
    from: "{{ mail_from }}"
    to: "{{ mail_to }}"
    subject: "RHEL Patching Report"
    subtype: html
    body: "{{ lookup('ansible.builtin.file', '/tmp/patching-report.html') }}"
  run_once: true

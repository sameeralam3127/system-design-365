---
# Playbook: patch_update_and_reboot.yml
# Purpose: Safely patch Linux systems and reboot only when required
# Handles edge cases: unreachable hosts, package manager locks,
# conditional reboots, long reboots, and post-reboot validation

- name: Patch Linux systems and reboot if required
  hosts: ubuntu
  become: true
  gather_facts: yes
  serial: 10 # Patch in controlled batches

  vars:
    reboot_timeout: 900
    pre_reboot_delay: 10
    post_reboot_delay: 30

  pre_tasks:
    - name: Ensure host is reachable before starting
      ansible.builtin.ping:
      register: ping_result
      ignore_unreachable: yes
      ignore_errors: yes

    - name: Skip host if unreachable
      ansible.builtin.meta: end_host
      when: ping_result is failed or ping_result is unreachable

  tasks:
    - name: Wait for package manager lock to be released (Debian/Ubuntu)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      when: ansible_facts['os_family'] == 'Debian'

    - name: Update all packages on Debian/Ubuntu
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
      register: apt_result
      when: ansible_facts['os_family'] == 'Debian'

    - name: Update all packages on RHEL/CentOS/Alma/Rocky
      ansible.builtin.yum:
        name: "*"
        state: latest
      register: yum_result
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Determine if reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_facts['os_family'] == 'Debian'

    - name: Set reboot flag (Debian/Ubuntu)
      ansible.builtin.set_fact:
        reboot_required: true
      when:
        - ansible_facts['os_family'] == 'Debian'
        - reboot_required_file.stat.exists

    - name: Set reboot flag (RHEL-based systems)
      ansible.builtin.set_fact:
        reboot_required: true
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - yum_result is changed

  handlers:
    - name: Reboot system
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: "{{ pre_reboot_delay }}"
        post_reboot_delay: "{{ post_reboot_delay }}"
        test_command: whoami

  post_tasks:
    - name: Reboot if required
      ansible.builtin.meta: flush_handlers
      when: reboot_required | default(false)

    - name: Verify system is back online after reboot
      ansible.builtin.ping:
      register: post_reboot_ping
      retries: 5
      delay: 10
      until: post_reboot_ping is success

    - name: Report patching result
      ansible.builtin.debug:
        msg: "Patching completed successfully on {{ inventory_hostname }}"
